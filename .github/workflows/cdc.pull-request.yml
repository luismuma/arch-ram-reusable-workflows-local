# Copyright (c) MAPFRE DevOps Platform
#
# Pull Request Workflow.
#
# Triggers:
#   - feature/* -> develop
#   - hotfix/*  -> main
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER
#   - AZURE_ARTIFACTS_PW
#   - EXTERNAL_GITHUB_TOKEN or GH_GIT_TOKEN
#   - GH_TOKEN_ENCRYPTION_PASSPHRASE (when centralized tokens are enabled)

name: PR workflow

run-name: "Build and Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_call:
    inputs:
      manifest-file:
        description: 'Manifest file'
        required: false
        type: string
        default: 'project-manifest.json'

    secrets:
      AZURE_ARTIFACTS_USER:
        description: 'User Azure Artifacts'
        required: true

      AZURE_ARTIFACTS_PW:
        description: 'Password Azure Artifacts'
        required: true

      # Token genérico para acceder a repositorios externos.
      EXTERNAL_GITHUB_TOKEN:
        description: 'Generic external GitHub token'
        required: false

      # Compatibilidad con el nombre anterior.
      GH_GIT_TOKEN:
        description: 'GitHub Token for checking out the code'
        required: false

      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for encrypting centralized tokens'
        required: false

jobs:

  # ============================================================================
  # INIT: VALIDACIÓN DEL WORKFLOW DE GITHUB ACTIONS
  # TEMPORALMENTE DESACTIVADA
  # ============================================================================

  # init:
  #   name: Validate GitHub Workflow
  #   uses: ./.github/workflows/validate-workflow.yml
  #   with:
  #     workflow_file: cdc.pull-request.yml
  #     schema: pull-request.schema.json

  # ============================================================================
  # VALIDA LAS RAMAS DE ORIGEN Y DESTINO DEL PULL REQUEST
  # ============================================================================

  validate-pr-branches:
    name: Validate PR Source and Target Branches
    runs-on: ubuntu-latest

    steps:
      - name: Validar ramas de origen y destino
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDACIÓN DE RAMAS DEL PULL REQUEST"
          echo "================================================"
          echo "Rama origen: $SOURCE_BRANCH"
          echo "Rama destino: $TARGET_BRANCH"

          if [[ "$SOURCE_BRANCH" == feature/* &&
                "$TARGET_BRANCH" == "develop" ]]; then

            echo "Validación correcta: feature -> develop"

          elif [[ "$SOURCE_BRANCH" == hotfix/* &&
                  "$TARGET_BRANCH" == "main" ]]; then

            echo "Validación correcta: hotfix -> main"

          else
            echo "::error::Combinación de ramas no permitida."
            echo "::error::Permitido: feature/* -> develop"
            echo "::error::Permitido: hotfix/* -> main"
            exit 1
          fi

  # ============================================================================
  # GENERA TOKENS CENTRALIZADOS
  # ============================================================================

  token-generate:
    name: Generate Centralized Tokens
    needs:
      - validate-pr-branches

    if: >-
      needs.validate-pr-branches.result == 'success' &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )

    uses: ./.github/workflows/token-generate.yml

    with:
      profile: reader

    secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # ============================================================================
  # PREPARE Y VALIDACIÓN JSON SCHEMA
  # TEMPORALMENTE DESACTIVADO
  # ============================================================================

  # Este job queda comentado.
  # Sus funciones anteriores eran descifrar el token centralizado,
  # descargar inventarios CDC y validar el JSON contra JSON Schema.

  # ============================================================================
  # VALIDA RUTAS, TEMPLATING Y ESTRUCTURA MEDIANTE SPECTRAL
  # ============================================================================

  pull-request:
    name: Validate CDC application template
    needs:
      - validate-pr-branches
      - token-generate

    if: >-
      always() &&
      needs.validate-pr-branches.result == 'success' &&
      (
        needs.token-generate.result == 'success' ||
        needs.token-generate.result == 'skipped'
      )

    uses: ./.github/workflows/cdc.validate-ruta-and-spectral.yml

    with:
      manifest-file: ${{ inputs.manifest-file }}
      templating-test: tests/test-templating.py
      #spectral-ruleset: spectral/rules/structure/application.yaml
      #spectral-files: |
      #  config-CDC/application/cdc_input_json_content.json
      centralized-tokens: ${{ needs.token-generate.outputs.centralized-tokens == 'true' }}

    secrets:
      AZURE_ARTIFACTS_USER: ${{ secrets.AZURE_ARTIFACTS_USER }}
      AZURE_ARTIFACTS_PW: ${{ secrets.AZURE_ARTIFACTS_PW }}
      GH_GIT_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # ============================================================================
  # NUEVO JOB: DESCARGA LOS FICHEROS DEL INVENTARIO CDC
  # Se ejecuta después de pull-request y antes de revoke-tokens.
  # ============================================================================

  load-cdc-inventory:
    name: Load CDC Inventory Files

    needs:
      - pull-request

    if: >-
      always() &&
      needs.pull-request.result == 'success'

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout del repositorio que ejecuta el workflow
      # ------------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v6
      # 2. DIAGNÓSTICO: comprobar que el secreto llega al job
      - name: Diagnose GitHub token availability
        shell: bash
        env:
          GH_GIT_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -n "${GH_GIT_TOKEN:-}" ]]; then
            echo "Token recibido correctamente."
          else
            echo "::error::El workflow reutilizable no ha recibido el token."
            exit 1
          fi
      # ------------------------------------------------------------------------
      # 2. Clona el repositorio de inventario CDC
      # ------------------------------------------------------------------------

      - name: Clone CDC inventory repository
        shell: bash
        env:
          GH_GIT_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${GH_GIT_TOKEN:-}" ]]; then
            echo "::error::No está configurado EXTERNAL_GITHUB_TOKEN ni GH_GIT_TOKEN."
            exit 1
          fi

          REPO_DIR="$RUNNER_TEMP/ioeu-cdc-repo-piloto-cdc-local"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_GIT_TOKEN" | base64 -w 0)" \
            clone \
            --filter=blob:none \
            --no-checkout \
            https://github.com/luismuma/ioeu-cdc-repo-piloto-cdc-local.git \
            "$REPO_DIR"

          cd "$REPO_DIR"

          git sparse-checkout init --no-cone

          git sparse-checkout set --no-cone \
            cdc-controller/config/inventory_connections/db_connections.yaml \
            cdc-controller/config/inventory_connections/target_connections.yaml

          git checkout main

          # --------------------------------------------------------------------
          # 3. Copia los ficheros al workspace del job
          # --------------------------------------------------------------------

          DEST_DIR="$GITHUB_WORKSPACE/inventory_connections"

          mkdir -p "$DEST_DIR"

          for file in \
            cdc-controller/config/inventory_connections/db_connections.yaml \
            cdc-controller/config/inventory_connections/target_connections.yaml
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::No se encuentra el fichero: $file"
              exit 1
            fi

            cp "$file" "$DEST_DIR/"
          done

      # ------------------------------------------------------------------------
      # 4. Verifica los ficheros descargados
      # ------------------------------------------------------------------------

      - name: Verify CDC inventory files
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFICACIÓN DEL INVENTARIO CDC"
          echo "================================================"

          for file in \
            inventory_connections/db_connections.yaml \
            inventory_connections/target_connections.yaml
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::El fichero no existe o está vacío: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "Inventario CDC cargado correctamente."

  # ============================================================================
  # REVOCA LOS TOKENS CENTRALIZADOS
  # ============================================================================

  revoke-tokens:
    name: Revoke Centralized Tokens

    needs:
      - pull-request
      - load-cdc-inventory
      - token-generate

    # always() permite intentar la revocación incluso si falla la
    # validación o la descarga del inventario.
    # Solo se intenta si token-generate terminó correctamente y
    # generó tokens centralizados que deben revocarse.
    if: >-
      always() &&
      needs.token-generate.result == 'success' &&
      needs.token-generate.outputs.centralized-tokens == 'true'

    uses: ./.github/workflows/token-revoke.yml

    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

