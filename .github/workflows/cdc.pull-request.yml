# Copyright (c) MAPFRE DevOps Platform
#
# Pull Request Workflow.
#
# Triggers:
#   - feature/* -> develop
#   - hotfix/*  -> main
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER
#   - AZURE_ARTIFACTS_PW
#   - EXTERNAL_GITHUB_TOKEN or GH_GIT_TOKEN
#   - GH_TOKEN_ENCRYPTION_PASSPHRASE (when centralized tokens are enabled)

name: PR workflow

run-name: "Build and Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_call:
    inputs:
      manifest-file:
        description: 'Manifest file'
        required: false
        type: string
        default: 'project-manifest.json'

    secrets:
      AZURE_ARTIFACTS_USER:
        description: 'User Azure Artifacts'
        required: true

      AZURE_ARTIFACTS_PW:
        description: 'Password Azure Artifacts'
        required: true

      # Token genérico para acceder a repositorios externos.
      EXTERNAL_GITHUB_TOKEN:
        description: 'Generic external GitHub token'
        required: false

      # Compatibilidad con el nombre anterior.
      GH_GIT_TOKEN:
        description: 'GitHub Token for checking out the code'
        required: false

      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for encrypting centralized tokens'
        required: false

jobs:

  # ============================================================================
  # INIT: VALIDACIÓN DEL WORKFLOW DE GITHUB ACTIONS
  # TEMPORALMENTE DESACTIVADA
  # ============================================================================

  # init:
  #   name: Validate GitHub Workflow
  #   uses: ./.github/workflows/validate-workflow.yml
  #   with:
  #     workflow_file: cdc.pull-request.yml
  #     schema: pull-request.schema.json

  # ============================================================================
  # VALIDA LAS RAMAS DE ORIGEN Y DESTINO DEL PULL REQUEST
  # ============================================================================

  validate-pr-branches:
    name: Validate PR Source and Target Branches
    runs-on: ubuntu-latest

    steps:
      - name: Validar ramas de origen y destino
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDACIÓN DE RAMAS DEL PULL REQUEST"
          echo "================================================"
          echo "Rama origen: $SOURCE_BRANCH"
          echo "Rama destino: $TARGET_BRANCH"

          if [[ "$SOURCE_BRANCH" == feature/* &&
                "$TARGET_BRANCH" == "develop" ]]; then

            echo "Validación correcta: feature -> develop"

          elif [[ "$SOURCE_BRANCH" == hotfix/* &&
                  "$TARGET_BRANCH" == "main" ]]; then

            echo "Validación correcta: hotfix -> main"

          else
            echo "::error::Combinación de ramas no permitida."
            echo "::error::Permitido: feature/* -> develop"
            echo "::error::Permitido: hotfix/* -> main"
            exit 1
          fi

  # ============================================================================
  # GENERA TOKENS CENTRALIZADOS
  # ============================================================================

  token-generate:
    name: Generate Centralized Tokens
    needs:
      - validate-pr-branches

    if: >-
      needs.validate-pr-branches.result == 'success' &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )

    uses: ./.github/workflows/token-generate.yml

    with:
      profile: reader

    secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # ============================================================================
  # PREPARE Y VALIDACIÓN JSON SCHEMA
  # TEMPORALMENTE DESACTIVADO
  # ============================================================================

  # Este job queda comentado.
  # Sus funciones anteriores eran descifrar el token centralizado,
  # descargar inventarios CDC y validar el JSON contra JSON Schema.

  # ============================================================================
  # VALIDA RUTAS, TEMPLATING Y ESTRUCTURA MEDIANTE SPECTRAL
  # ============================================================================

  pull-request:
    name: Validate CDC application template
    needs:
      - validate-pr-branches
      - token-generate

    if: >-
      always() &&
      needs.validate-pr-branches.result == 'success' &&
      (
        needs.token-generate.result == 'success' ||
        needs.token-generate.result == 'skipped'
      )

    uses: ./.github/workflows/cdc.validate-ruta-and-spectral.yml

    with:
      manifest-file: ${{ inputs.manifest-file }}
      templating-test: tests/test-templating.py
      #spectral-ruleset: spectral/rules/structure/application.yaml
      #spectral-files: |
      #  config-CDC/application/cdc_input_json_content.json
      centralized-tokens: ${{ needs.token-generate.outputs.centralized-tokens == 'true' }}

    secrets:
      AZURE_ARTIFACTS_USER: ${{ secrets.AZURE_ARTIFACTS_USER }}
      AZURE_ARTIFACTS_PW: ${{ secrets.AZURE_ARTIFACTS_PW }}
      GH_GIT_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # ============================================================================
  # JOB: DESCARGA LOS FICHEROS DEL INVENTARIO CDC
  #
  # MODIFICACIÓN:
  # - Se elimina el diagnóstico que exigía obligatoriamente un token.
  # - Se permite clonar el repositorio público sin autenticación.
  # - Si existe EXTERNAL_GITHUB_TOKEN o GH_GIT_TOKEN, se utiliza autenticación.
  # - Se mantienen la copia y la validación de los dos ficheros descargados.
  # ============================================================================

  load-cdc-inventory:
    name: Load CDC Inventory Files

    needs:
      - pull-request

    if: >-
      always() &&
      needs.pull-request.result == 'success'

    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # 1. Checkout del repositorio que ejecuta el workflow
      # ------------------------------------------------------------------------

      - name: Checkout code
        uses: actions/checkout@v6

      # ------------------------------------------------------------------------
      # NUEVO: DIAGNÓSTICO DEL WORKSPACE Y DEL PROYECTO
      #
      # Objetivo:
      # - Identificar el repositorio y la rama de ejecución.
      # - Mostrar el directorio de trabajo del runner.
      # - Localizar directorios y ficheros YAML/JSON.
      # - Investigar si el proyecto generado ya existe en este workspace.
      # ------------------------------------------------------------------------

      - name: "NUEVO - Diagnose GitHub workspace and project"
        shell: bash
        run: |
          set -uo pipefail

          echo "================================================"
          echo "NUEVO - CONTEXTO DE GITHUB ACTIONS"
          echo "================================================"

          echo "Repository:       $GITHUB_REPOSITORY"
          echo "Repository owner: $GITHUB_REPOSITORY_OWNER"
          echo "Workspace:        $GITHUB_WORKSPACE"
          echo "Runner temp:      $RUNNER_TEMP"
          echo "Runner OS:        $RUNNER_OS"
          echo "Workflow:         $GITHUB_WORKFLOW"
          echo "Job:              $GITHUB_JOB"
          echo "Run ID:           $GITHUB_RUN_ID"
          echo "Run number:       $GITHUB_RUN_NUMBER"
          echo "Ref:              $GITHUB_REF"
          echo "SHA:              $GITHUB_SHA"
          echo "Event:            $GITHUB_EVENT_NAME"

          echo ""
          echo "================================================"
          echo "NUEVO - CONTENIDO DEL WORKSPACE"
          echo "================================================"

          pwd
          ls -la "$GITHUB_WORKSPACE"

          echo ""
          echo "================================================"
          echo "NUEVO - POSIBLES DIRECTORIOS DEL PROYECTO"
          echo "================================================"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 5 \
            -type d \
            \( -name .git -o -name node_modules -o -name .venv \) -prune \
            -o \
            -type d \
            \( -name cdc-controller \
               -o -name inventory_connections \
               -o -name generated-config \) \
            -print

          echo ""
          echo "================================================"
          echo "NUEVO - FICHEROS YAML Y JSON DEL WORKSPACE"
          echo "================================================"

          find "$GITHUB_WORKSPACE" \
            -maxdepth 6 \
            -type f \
            \( -name "*.yaml" -o -name "*.yml" -o -name "*.json" \) \
            -print | head -200

      # ------------------------------------------------------------------------
      # 2. Clona el repositorio público de inventario CDC.
      #
      # MODIFICADO:
      # - Si hay token, clona con autenticación.
      # - Si no hay token, intenta clonar sin autenticación.
      # - Ya no falla únicamente porque los secretos estén vacíos.
      # ------------------------------------------------------------------------

      - name: Clone CDC inventory repository
        shell: bash
        env:
          GH_GIT_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}
        run: |
          set -euo pipefail

          REPO_DIR="$RUNNER_TEMP/ioeu-cdc-repo-piloto-cdc-local"
          REPO_URL="https://github.com/luismuma/ioeu-cdc-repo-piloto-cdc-local.git"

          echo "================================================"
          echo "DESCARGA DEL INVENTARIO CDC"
          echo "================================================"

          if [[ -n "${GH_GIT_TOKEN:-}" ]]; then
            echo "Se utilizará autenticación mediante token."

            git \
              -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_GIT_TOKEN" | base64 -w 0)" \
              clone \
              --filter=blob:none \
              --no-checkout \
              "$REPO_URL" \
              "$REPO_DIR"
          else
            echo "No hay token configurado."
            echo "Se intentará descargar el repositorio público sin autenticación."

            git clone \
              --filter=blob:none \
              --no-checkout \
              "$REPO_URL" \
              "$REPO_DIR"
          fi

          cd "$REPO_DIR"

          # Descarga selectiva de los dos ficheros necesarios.
          git sparse-checkout init --no-cone

          git sparse-checkout set --no-cone \
            cdc-controller/config/inventory_connections/db_connections.yaml \
            cdc-controller/config/inventory_connections/target_connections.yaml

          git checkout main

          # --------------------------------------------------------------------
          # 3. Copia los ficheros al workspace del job
          # --------------------------------------------------------------------

          DEST_DIR="$GITHUB_WORKSPACE/inventory_connections"

          mkdir -p "$DEST_DIR"

          for file in \
            cdc-controller/config/inventory_connections/db_connections.yaml \
            cdc-controller/config/inventory_connections/target_connections.yaml
          do
            if [[ ! -f "$file" ]]; then
              echo "::error::No se encuentra el fichero: $file"
              exit 1
            fi

            cp "$file" "$DEST_DIR/"
            echo "Copiado: ${file##*/}"
          done

      # ------------------------------------------------------------------------
      # 4. Verifica los ficheros descargados
      #
      # Se mantiene la validación para evitar continuar con un inventario
      # incompleto o con ficheros vacíos.
      # ------------------------------------------------------------------------

      - name: Verify CDC inventory files
        shell: bash
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VERIFICACIÓN DEL INVENTARIO CDC"
          echo "================================================"

          for file in \
            inventory_connections/db_connections.yaml \
            inventory_connections/target_connections.yaml
          do
            if [[ ! -s "$file" ]]; then
              echo "::error::El fichero no existe o está vacío: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "Inventario CDC cargado correctamente."

      ```yaml
      # ==========================================================================
      # NUEVO: COPIAR EL INVENTARIO AL PROYECTO EN LA CARPETA inventory
      #
      # Objetivo:
      # - Crear la carpeta inventory en el repositorio que ejecuta el workflow.
      # - Copiar los dos YAML descargados.
      # - Verificar su contenido.
      # ==========================================================================

      - name: "NUEVO - Copy CDC inventory into project"
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/inventory_connections"
          DEST_DIR="$GITHUB_WORKSPACE/inventory"

          echo "================================================"
          echo "COPIANDO INVENTARIO AL PROYECTO"
          echo "================================================"

          mkdir -p "$DEST_DIR"

          for file in \
            db_connections.yaml \
            target_connections.yaml
          do
            if [[ ! -s "$SOURCE_DIR/$file" ]]; then
              echo "::error::Fichero de origen inexistente o vacío: $SOURCE_DIR/$file"
              exit 1
            fi

            cp "$SOURCE_DIR/$file" "$DEST_DIR/$file"
            echo "Copiado: inventory/$file"
          done

          echo ""
          echo "Contenido de la carpeta inventory:"
          ls -l "$DEST_DIR"

          test -s "$DEST_DIR/db_connections.yaml"
          test -s "$DEST_DIR/target_connections.yaml"

          echo "Inventario copiado y verificado correctamente."

      # ==========================================================================
      # NUEVO: GUARDAR LOS FICHEROS EN LA RAMA REMOTA
      #
      # IMPORTANTE:
      # - Este paso requiere permiso de escritura en el repositorio.
      # - En un pull_request desde un fork, normalmente no habrá permisos.
      # - El token GITHUB_TOKEN debe tener contents: write.
      # ==========================================================================

      - name: "Commit CDC inventory to current branch"
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add inventory/db_connections.yaml \
                  inventory/target_connections.yaml

          if git diff --cached --quiet; then
            echo "El inventario no presenta cambios. No se necesita commit."
            exit 0
          fi

          git commit -m "chore: update CDC inventory files"

          echo "Inventario preparado en un commit local."
          echo "Rama actual: $(git branch --show-current)"
          echo "Commit: $(git rev-parse --short HEAD)"

          # No se realiza push automático desde un workflow de pull request.
          # Para publicar el commit, debe habilitarse explícitamente
          # la escritura y definirse la estrategia de actualización de la rama.
  
  
  # ============================================================================
  # REVOCA LOS TOKENS CENTRALIZADOS
  # ============================================================================

  revoke-tokens:
    name: Revoke Centralized Tokens

    needs:
      - pull-request
      - load-cdc-inventory
      - token-generate

    # always() permite intentar la revocación incluso si falla la
    # validación o la descarga del inventario.
    # Solo se intenta si token-generate terminó correctamente y
    # generó tokens centralizados que deben revocarse.
    if: >-
      always() &&
      needs.token-generate.result == 'success' &&
      needs.token-generate.outputs.centralized-tokens == 'true'

    uses: ./.github/workflows/token-revoke.yml

    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

