# Pull Request Workflow.
#
# Triggers:
#   - feature/* -> develop
#   - hotfix/*  -> main
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER
#   - AZURE_ARTIFACTS_PW
#   - EXTERNAL_GITHUB_TOKEN or GH_GIT_TOKEN
#   - GH_TOKEN_ENCRYPTION_PASSPHRASE (when centralized tokens are enabled)

name: PR workflow

run-name: "Build and Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_call:
    inputs:
      manifest-file:
        description: 'Manifest file'
        required: false
        type: string
        default: 'project-manifest.json'

    secrets:
      AZURE_ARTIFACTS_USER:
        description: 'User Azure Artifacts'
        required: true

      AZURE_ARTIFACTS_PW:
        description: 'Password Azure Artifacts'
        required: true

      # NUEVO: nombre genérico del token de GitHub.
      EXTERNAL_GITHUB_TOKEN:
        description: 'Generic external GitHub token'
        required: false

      # COMPATIBILIDAD: nombre anterior.
      GH_GIT_TOKEN:
        description: 'GitHub Token for checking out the code'
        required: false

      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for encrypting centralized tokens'
        required: false
  
jobs:

  # ============================================================================
  # INIT: VALIDACIÓN DEL WORKFLOW DE GITHUB ACTIONS
  # TEMPORALMENTE DESACTIVADA
  # ============================================================================
  #
  # Se comenta este job para no ejecutar validate-workflow.yml ni
  # pull-request.schema.json.
  #
  # Para volver a activarlo, descomenta este bloque y añade init a las
  # dependencias de los jobs que lo necesiten.
  #
  # init:
  #   name: Validate GitHub Workflow
  #   uses: ./.github/workflows/validate-workflow.yml
  #   with:
  #     workflow_file: cdc.pull-request.yml
  #     schema: pull-request.schema.json

  # ============================================================================
  # VALIDA LAS RAMAS DE ORIGEN Y DESTINO DEL PULL REQUEST
  # ============================================================================

  validate-pr-branches:
    name: Validate PR Source and Target Branches
    runs-on: ubuntu-latest

    steps:
      - name: Validar ramas de origen y destino
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          echo "================================================"
          echo "VALIDACIÓN DE RAMAS DEL PULL REQUEST"
          echo "================================================"
          echo "Rama origen: $SOURCE_BRANCH"
          echo "Rama destino: $TARGET_BRANCH"

          if [[ "$SOURCE_BRANCH" == feature/* &&
                "$TARGET_BRANCH" == "develop" ]]; then

            echo "Validación correcta: feature -> develop"

          elif [[ "$SOURCE_BRANCH" == hotfix/* &&
                  "$TARGET_BRANCH" == "main" ]]; then

            echo "Validación correcta: hotfix -> main"

          else
            echo "::error::Combinación de ramas no permitida."
            echo "::error::Permitido: feature/* -> develop"
            echo "::error::Permitido: hotfix/* -> main"
            exit 1
          fi

  # ============================================================================
  # GENERA TOKENS CENTRALIZADOS
  # ============================================================================

  token-generate:
    name: Generate Centralized Tokens
    needs:
      - validate-pr-branches

    if: >-
      needs.validate-pr-branches.result == 'success' &&
      (
        startsWith(github.event.pull_request.head.ref, 'feature/') ||
        startsWith(github.event.pull_request.head.ref, 'hotfix/')
      )

    uses: ./.github/workflows/token-generate.yml

    with:
      profile: reader
    
    secrets:
      # NUEVO: acepta el secreto genérico si se ha proporcionado.
      # COMPATIBILIDAD: si no existe, utiliza GH_GIT_TOKEN.
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.EXTERNAL_GITHUB_TOKEN || secrets.GH_GIT_TOKEN }}

      # Se mantiene la contraseña de cifrado.
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

    #secrets:
    #  EXTERNAL_GITHUB_TOKEN: ${{ secrets.GH_GIT_TOKEN }}
    #  GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

