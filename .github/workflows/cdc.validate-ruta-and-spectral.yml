# Reusable workflow:
# - Ejecuta los tests de templating Ruta.
# - Valida el JSON de configuración CDC mediante JSON Schema.
# - Conserva toda la sección de Spectral comentada.

name: Validate Ruta and CDC JSON Schema

on:
  workflow_call:
    inputs:
      manifest-file:
        description: 'Manifest file used by Ruta tests'
        required: false
        type: string
        default: 'project-manifest.json'

      templating-test:
        description: 'Ruta al fichero de test de templating Ruta'
        required: false
        type: string
        default: 'tests/test-templating.py'

      # ==================================================
      # SPECTRAL - INPUTS DESACTIVADOS
      # ==================================================
      # spectral-ruleset:
      #   description: 'Ruta al fichero ruleset de Spectral'
      #   required: false
      #   type: string
      #   default: 'spectral/rules/structure/ruleset.yml'
      #
      # spectral-files:
      #   description: 'Lista de ficheros a validar, uno por línea'
      #   required: true
      #   type: string

      centralized-tokens:
        description: 'Indica si el workflow usa tokens centralizados'
        required: true
        type: boolean

    secrets:
      AZURE_ARTIFACTS_USER:
        description: 'Usuario de Azure Artifacts'
        required: true

      AZURE_ARTIFACTS_PW:
        description: 'Password o token de Azure Artifacts'
        required: true

      GH_GIT_TOKEN:
        description: 'Token para checkout y acceso autenticado a GitHub'
        required: false

      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase para descifrar el token centralizado'
        required: false

jobs:
  # ==================================================
  # 1. VALIDACIÓN DE TEMPLATING RUTA
  # ==================================================
  validate-templating:
    name: Validate Ruta Templating
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      MANIFEST_FILE: ${{ inputs.manifest-file }}
      CENTRALIZED_TOKENS: ${{ inputs.centralized-tokens }}
      AZURE_ARTIFACTS_USER: ${{ secrets.AZURE_ARTIFACTS_USER }}
      AZURE_ARTIFACTS_PW: ${{ secrets.AZURE_ARTIFACTS_PW }}
      GH_GIT_TOKEN: ${{ secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install pytest

          if [[ -f "pyproject.toml" ]]; then
            python -m pip install ".[test]" || python -m pip install .
          elif [[ -f "requirements.txt" ]]; then
            python -m pip install -r requirements.txt
          fi

      - name: Verify Ruta test file
        shell: bash
        env:
          TEMPLATING_TEST: ${{ inputs.templating-test }}
        run: |
          set -euo pipefail

          if [[ ! -f "${TEMPLATING_TEST}" ]]; then
            echo "::error file=${TEMPLATING_TEST}::No existe el fichero de test Ruta."
            exit 1
          fi

          echo "OK: ${TEMPLATING_TEST}"

      - name: Run Ruta templating tests
        shell: bash
        env:
          TEMPLATING_TEST: ${{ inputs.templating-test }}
        run: |
          set -euo pipefail

          python -m pytest "${TEMPLATING_TEST}" \
            --verbose \
            --tb=short

  # ==================================================
  # 2. VALIDACIÓN DEL JSON CDC MEDIANTE JSON SCHEMA
  # ==================================================
  validate-cdc-json-schema:
    name: Validate CDC JSON against JSON Schema
    runs-on: ubuntu-latest
    needs:
      - validate-templating

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_GIT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Verify CDC JSON and schema files
        shell: bash
        env:
          CDC_SCHEMA_FILE: json-schemas/cdc.pull-request.schema.json
          CDC_CONFIG_FILE: config-CDC/application/cdc_input_json_content.json
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "Comprobando JSON CDC y JSON Schema"
          echo "=============================================="

          if [[ ! -f "${CDC_SCHEMA_FILE}" ]]; then
            echo "::error file=${CDC_SCHEMA_FILE}::No existe el JSON Schema CDC."
            echo "Comprueba que el esquema está en json-schemas/."
            exit 1
          fi

          if [[ ! -f "${CDC_CONFIG_FILE}" ]]; then
            echo "::error file=${CDC_CONFIG_FILE}::No existe el JSON de configuración CDC."
            echo "Comprueba la ruta del JSON en el repositorio."
            exit 1
          fi

          echo "OK: ${CDC_SCHEMA_FILE}"
          echo "OK: ${CDC_CONFIG_FILE}"

      - name: Validate CDC JSON against JSON Schema
        shell: bash
        env:
          CDC_SCHEMA_FILE: json-schemas/cdc.pull-request.schema.json
          CDC_CONFIG_FILE: config-CDC/application/cdc_input_json_content.json
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema_path = Path(os.environ["CDC_SCHEMA_FILE"])
          config_path = Path(os.environ["CDC_CONFIG_FILE"])

          print("==============================================")
          print("Validando configuración CDC mediante JSON Schema")
          print("==============================================")
          print(f"Schema: {schema_path}")
          print(f"JSON:   {config_path}")

          try:
              with schema_path.open(encoding="utf-8") as file:
                  schema = json.load(file)

              with config_path.open(encoding="utf-8") as file:
                  config = json.load(file)

          except json.JSONDecodeError as error:
              print(
                  f"::error::JSON inválido: línea {error.lineno}, "
                  f"columna {error.colno}: {error.msg}"
              )
              sys.exit(1)

          except OSError as error:
              print(f"::error::{error}")
              sys.exit(1)

          try:
              Draft202012Validator.check_schema(schema)
          except Exception as error:
              print(f"::error::El JSON Schema no es válido: {error}")
              sys.exit(1)

          validator = Draft202012Validator(schema)
          errors = sorted(
              validator.iter_errors(config),
              key=lambda error: list(map(str, error.absolute_path))
          )

          if errors:
              print("Se han encontrado errores de validación:")

              for error in errors:
                  path = ".".join(
                      str(part) for part in error.absolute_path
                  ) or "$"

                  print(
                      f"::error file={config_path}::"
                      f"{path}: {error.message}"
                  )

              sys.exit(1)

          print("OK: el JSON CDC cumple el JSON Schema.")
          PY

