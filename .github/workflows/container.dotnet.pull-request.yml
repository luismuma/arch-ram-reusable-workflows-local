# Pull Request Workflow for .NET containers.

name: .NET Container Pull Request
run-name: "Build and Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

on:
  workflow_call:
    inputs:
      dotnet-root:
        description: 'Directory containing global.json and the solution'
        required: false
        type: string
        default: 'dotnet'
      solution-file:
        description: 'Solution file relative to dotnet-root'
        required: false
        type: string
        default: 'Ram.Microservice.sln'
      nuget-config:
        description: 'NuGet config relative to dotnet-root'
        required: false
        type: string
        default: 'nuget.config'
      configuration:
        description: '.NET build configuration'
        required: false
        type: string
        default: 'Release'
      dockerfile-path:
        description: 'Dockerfile path relative to the repository'
        required: false
        type: string
        default: 'docker/Dockerfile'
      docker-context:
        description: 'Docker build context'
        required: false
        type: string
        default: '.'
    secrets:
      ACR_TOKEN_USER:
        description: 'ACR user'
        required: true
      ACR_TOKEN_PW:
        description: 'ACR password'
        required: true
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: true

jobs:
  token-generate:
    if: (contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/'))
    uses: ./.github/workflows/token-generate.yml
    with:
      profile: 'reader'
    secrets:
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
    needs: token-generate
    uses: ./.github/workflows/validate-workflow.yml
    with:
      workflow_file: 'pull-request.yml'
      schema: 'container.dotnet.pull-request.schema.yml'
      centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
    secrets:
      GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  pull-request:
    name: Build and Test
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: ${{ inputs.dotnet-root }}/global.json

      - name: Restore packages
        working-directory: ${{ inputs.dotnet-root }}
        run: dotnet restore "${{ inputs.solution-file }}" --configfile "${{ inputs.nuget-config }}"

      - name: Build
        working-directory: ${{ inputs.dotnet-root }}
        run: dotnet build "${{ inputs.solution-file }}" --configuration "${{ inputs.configuration }}" --no-restore

      - name: Test
        working-directory: ${{ inputs.dotnet-root }}
        run: dotnet test "${{ inputs.solution-file }}" --configuration "${{ inputs.configuration }}" --no-build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: acrmapfredevops.azurecr.io
          username: ${{ secrets.ACR_TOKEN_USER }}
          password: ${{ secrets.ACR_TOKEN_PW }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile-path }}
          push: false
          tags: test

  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [init, token-generate]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}