#
# Merge Commit Workflow. Triggers when:
#   - A pull request to develop is closed and merged
#   - A pull request to main is closed and merged
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER    (Organization)
#   - AZURE_ARTIFACTS_PW      (Organization)
#   - RAM_GITHUB_GIT_TOKEN    (Repository)

name: Merge Commit
run-name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact #${{ github.run_number }}"

on:
  workflow_call:
    inputs:
      acr-folder:
        description: 'ACR Folder'
        required: true
        type: string
        default: ''
      java-version:
        description: 'Java Version'
        required: false
        type: string
        default: '8.0.412+8'
      java-extra-args:
        description: 'Java Extra Args'
        required: false
        type: string
        default: '-Dsource.skip -DskipTests -Dcobertura.skip'
      jdk-distribution:
        description: 'JDK Distribution'
        required: false
        type: string
        default: 'temurin'
      maven-version:
        description: 'Maven Version'
        required: false
        type: string
        default: '3.9.6'
      cache-enabled:
        description: 'Cache Enabled'
        required: false
        type: boolean
        default: true
      source-folder:
        description: 'Source Folder'
        required: false
        type: string
        default: '.'
      skip-tests:
        description: 'Skip Tests'
        required: false
        type: boolean
        default: false
      next-snapshot-create-pull-request:
        description: 'Create Pull Request to develop'
        required: false
        type: boolean
        default: true
      docker-context:
        description: 'Docker Context'
        required: false
        type: string
        default: '.'
      component-name:
        description: 'Image name override (defaults to artifactId parsed from pom.xml)'
        required: false
        type: string
        default: ''
      clean-publish:
        description: 'param clean for mvn deploy action-java-maven (publish)'
        required: false
        type: boolean
        default: false
      is-fix:
        description: 'Indicates if the promotion is for a fix version'
        required: false
        type: boolean
        default: false
      prebuilt-artifact-name:
        description: 'Artifact uploaded by a previous job to restore before the Maven build. Empty disables the restore.'
        required: false
        type: string
        default: ''
      prebuilt-artifact-path:
        description: 'Path, relative to the workspace, where the artifact is restored'
        required: false
        type: string
        default: '.'
    secrets:
      AZURE_ARTIFACTS_USER: 
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW: 
        description: 'Password Azure Artifacts'
        required: true
      ACR_TOKEN_USER: 
        description: 'User ACR' 
        required: true
      ACR_TOKEN_PW:
        description: 'Password ACR'
        required: true
      RAM_GITHUB_GIT_TOKEN: 
        description: 'GitHub Token for creating Pull Request to develop'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false

env:
  # Merge to main/master (base_ref)
  IS_RELEASE: ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') }}  

jobs:

  check-caller:
    name: Check Direct Caller
    #https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-your-pull_request_target-workflow-when-a-pull-request-merges
    if: ${{ github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }}
    runs-on: ubuntu-latest
    outputs:
      is-direct: ${{ steps.check.outputs.is-direct }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if workflow references container.gaia directly
        id: check
        run: |
          WORKFLOW_FILE=".github/workflows/merge-commit.yml"
          if [[ ! -f "$WORKFLOW_FILE" ]]; then
            echo "::error::Workflow file $WORKFLOW_FILE not found"
            exit 1
          elif grep -Fq -- "container.gaia.merge-commit.yml" "$WORKFLOW_FILE"; then
            echo "is-direct=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Skipping schema validation — caller workflow does not directly reference container.gaia.merge-commit.yml"
            echo "is-direct=false" >> $GITHUB_OUTPUT
          fi

  # Generate centralized tokens if needed
  token-generate:
   #https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-your-pull_request_target-workflow-when-a-pull-request-merges
   if: ${{ github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }} 
   uses: ./.github/workflows/token-generate.yml  
   with:
      profile: 'deployer'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.RAM_GITHUB_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
     uses: ./.github/workflows/validate-workflow.yml
     needs: [check-caller, token-generate]
     if: needs.check-caller.outputs.is-direct == 'true'
     with:
        workflow_file: 'merge-commit.yml'
        schema: 'container.gaia.merge-commit.schema.yml'
        centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
     secrets:
        GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.RAM_GITHUB_GIT_TOKEN }}
        GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}
          
  merge:   
    needs: [check-caller, init, token-generate]
    if: ${{ !failure() && !cancelled() && github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }}
    name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact"
    runs-on: ubuntu-latest
    steps:
      - name: Decrypt token
        if: needs.token-generate.outputs.centralized-tokens == 'true'
        id: decrypt
        uses: mapfre-tech/action-ci-token/decrypt@v1
        with:
            token: ${{ needs.token-generate.outputs.token }}
            gh_token_encryption_passphrase: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}

      # Git-ignored content built by a previous job, not recovered by the checkout.
      - name: Restore prebuilt artifact
        if: inputs.prebuilt-artifact-name != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.prebuilt-artifact-name }}
          path: ${{ inputs.prebuilt-artifact-path }}

      - name: Setup Java/Maven
        uses: mapfre-tech/action-java-maven/setup@v1
        with:
          java-version: ${{ inputs.java-version }}
          jdk-distribution: ${{ inputs.jdk-distribution }}
          maven-version: ${{ inputs.maven-version }}
          cache-enabled: ${{ inputs.cache-enabled }}

      - name: Prepare Promotion
        id: prepare-promotion
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-java-maven/promotion@v1
        with:

          branch: ${{github.base_ref}}
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
          is-fix: ${{ inputs.is-fix }}

      - name: Build
        uses: mapfre-tech/action-java-maven/install@v1
        with:
          workspace: ${{ inputs.source-folder }}
          extra-args: ${{ inputs.java-extra-args }} 
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Unit Test
        if: ${{ !inputs.skip-tests }}
        uses: mapfre-tech/action-java-maven/junit@v1
        with:
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Extract Maven profiles from extra-args
        id: extract-profiles
        env:
          JAVA_EXTRA_ARGS: ${{ inputs.java-extra-args }}
        run: |
          profiles=$(echo "$JAVA_EXTRA_ARGS" | grep -oE '(^|[[:space:]])-P[[:space:]]*[^[:space:]]+' | sed -E 's/^[[:space:]]*-P[[:space:]]*//' | paste -sd, - || true)
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: mapfre-tech/action-java-maven/publish@v1
        with:
          pom-profile: ${{ steps.extract-profiles.outputs.profiles }}
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}      
          clean: ${{ inputs.clean-publish }}
      - name: Read POM
        id: read-pom
        uses: mapfre-tech/action-java-maven/read-pom@v1
        with:
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
          workspace: ${{ inputs.source-folder }}

      - name: Resolve image name
        id: resolve-image-name
        env:
          COMPONENT_NAME_OVERRIDE: ${{ inputs.component-name }}
          ARTIFACT_ID: ${{ steps.read-pom.outputs.artifactId }}
        run: |
          if [ -n "$COMPONENT_NAME_OVERRIDE" ]; then
            image_name="$COMPONENT_NAME_OVERRIDE"
          else
            image_name="$ARTIFACT_ID"
          fi
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        uses: mapfre-tech/action-azure/acr-push@v2
        with:
          acr-token-user: ${{ secrets.ACR_TOKEN_USER }}
          acr-token-pass: ${{ secrets.ACR_TOKEN_PW }}
          image: ${{ steps.resolve-image-name.outputs.image-name }}
          acr-folder: ${{ inputs.acr-folder }}
          dockerfile-path: docker/Dockerfile
          context: ${{ inputs.docker-context }}
          tag: ${{ steps.read-pom.outputs.version }}
          build-args: |
            pomversion=${{ steps.read-pom.outputs.version }}
      

      - name: Release Promotion (Commit & Push pom.xml)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: '"*pom.xml"'
          message: Promotion to RELEASE completed version (${{ steps.read-pom.outputs.version }})
          branch: ${{github.base_ref}}


      - name: Release Promotion (Tag Git Repository)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/tag-push@v1
        with:
          tag: ${{ steps.read-pom.outputs.version }}
          message: "New version tag ${{ steps.read-pom.outputs.version }}"


      - name: Next Snapshot Promotion (Set next version in pom.xml)
        id: next-snapshot-promotion       
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-java-maven/promotion@v1
        with:
          branch: develop
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
          is-fix: ${{ inputs.is-fix }}


      - name: Next Snapshot Promotion (Commit & Push pom.xml)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: '"*pom.xml"'
          message:  Promotion to next SNAPSHOT completed (${{ steps.next-snapshot-promotion.outputs.version }})
          branch: ${{github.base_ref}}          
          create-pull-request: ${{ inputs.next-snapshot-create-pull-request }} 
          pull-request-title: Next development version  (${{ steps.next-snapshot-promotion.outputs.version }})
          github-token: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ token-generate, merge ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}