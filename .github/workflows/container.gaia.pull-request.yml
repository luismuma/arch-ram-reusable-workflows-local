# Copyright (c) MAPFRE DevOps Platform
#
# Pull Request Workflow. Triggers when:
#   - A pull request from feature to develop is created / synchronized
#   - A pull request from hotfix to main is created / synchronized
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER    (Organization)
#   - AZURE_ARTIFACTS_PW      (Organization)
#   - ACR_TOKEN_USER          (Organization)
#   - ACR_TOKEN_PW            (Organization)
#   - SONAR_TOKEN             (Repository)
#   - SONAR_ROOT_CERT         (Repository)
#   - GH_GIT_TOKEN            (Repository)

name: PR workflow
run-name: "Build and Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

on:  
  workflow_call:
    inputs:
      sonar-project-key: 
        description: 'Sonar Project Key'
        required: false
        type: string
        default: ''
      sonar-project-name:
        description: 'Sonar Project Name'
        required: false
        type: string
        default: ''
      sonar-project-version:
        description: 'Sonar Project Version'
        required: false
        type: string
        default: ''
      sonar-host-url:
        description: 'Sonar Host URL'
        required: false
        type: string
        default: 'https://codereview.azure.mapfre.com'
      sonar-continue-on-error:
        description: 'Sonar Continue on Error'
        required: false
        type: boolean
        default: false
      java-version:
        description: 'Java Version'
        required: false
        type: string
        default: '8.0.412+8'
      java-extra-args:
        description: 'Java Extra Args'
        required: false
        type: string
        default: '-Dsource.skip -DskipTests -Dcobertura.skip'
      jdk-distribution:
        description: 'JDK Distribution'
        required: false
        type: string
        default: 'temurin'
      maven-version:
        description: 'Maven Version'
        required: false
        type: string
        default: '3.9.6'
      cache-enabled:
        description: 'Cache Enabled'
        required: false
        type: boolean
        default: true
      source-folder:
        description: 'Source Folder'
        required: false
        type: string
        default: '.'
      skip-tests:
        description: 'Skip Tests'
        required: false
        type: boolean
        default: false
      docker-context:
        description: 'Docker Context'
        required: false
        type: string
        default: '.'
      component-name:
        description: 'Image name override (defaults to artifactId parsed from pom.xml)'
        required: false
        type: string
        default: ''
      prebuilt-artifact-name:
        description: 'Artifact uploaded by a previous job to restore before the Maven build. Empty disables the restore.'
        required: false
        type: string
        default: ''
      prebuilt-artifact-path:
        description: 'Path, relative to the workspace, where the artifact is restored'
        required: false
        type: string
        default: '.'


    secrets:
      AZURE_ARTIFACTS_USER:
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW:
        description: 'Password Azure Artifacts' 
        required: true
      SONAR_TOKEN:
        description: 'Sonar Token'
        required: false
      SONAR_ROOT_CERT:
        description: 'Sonar Certificate'
        required: false
      ACR_TOKEN_USER: 
        description: 'User ACR'
        required: true
      ACR_TOKEN_PW:
        description: 'Password ACR'
        required: true
      GH_GIT_TOKEN:
        description: 'GitHub Token for checking out the code'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false
      
env:  
  SONAR_CONFIGURED: ${{ fromJSON(inputs.sonar-project-key != '' && inputs.sonar-project-name != '') }}
  JAVA_VERSION_SONAR_NO_COMPATIBLE: ${{ fromJSON(startsWith(inputs.java-version, '8') || startsWith(inputs.java-version, '9') || startsWith(inputs.java-version, '10') || startsWith(inputs.java-version, '11')) }}
jobs:
  check-caller:
    name: Check Direct Caller
    if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
    runs-on: ubuntu-latest
    outputs:
      is-direct: ${{ steps.check.outputs.is-direct }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check if workflow references container.gaia directly
        id: check
        run: |
          WORKFLOW_FILE=".github/workflows/pull-request.yml"
          if [[ ! -f "$WORKFLOW_FILE" ]]; then
            echo "::error::Workflow file $WORKFLOW_FILE not found"
            exit 1
          elif grep -Fq -- "container.gaia.pull-request.yml" "$WORKFLOW_FILE"; then
            echo "is-direct=true" >> $GITHUB_OUTPUT
          else
            echo "::notice::Skipping schema validation — caller workflow does not directly reference container.gaia.pull-request.yml"
            echo "is-direct=false" >> $GITHUB_OUTPUT
          fi

  # Generate centralized tokens if needed
  token-generate:
   if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
   uses: ./.github/workflows/token-generate.yml 
   with:
      profile: 'reader'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:     
     needs: [check-caller, token-generate]
     uses: ./.github/workflows/validate-workflow.yml
     if: needs.check-caller.outputs.is-direct == 'true'
     with:
        workflow_file: 'pull-request.yml'
        schema: 'container.gaia.pull-request.schema.yml'
        centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
     secrets:
        GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.GH_GIT_TOKEN }}
        GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ init, token-generate ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  pull-request:
    name: Build and Test
    needs: [check-caller, init]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      sonar-project-configured: ${{ inputs.sonar-project-key != '' && inputs.sonar-project-name != '' }}
    steps:
     
      - name: Checkout code
        uses: actions/checkout@v6

      # Git-ignored content built by a previous job, not recovered by the checkout.
      - name: Restore prebuilt artifact
        if: inputs.prebuilt-artifact-name != ''
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.prebuilt-artifact-name }}
          path: ${{ inputs.prebuilt-artifact-path }}

      - name: Setup Java/Maven
        uses: mapfre-tech/action-java-maven/setup@v1
        with:
          java-version: ${{ inputs.java-version }}
          jdk-distribution: ${{ inputs.jdk-distribution }}
          maven-version: ${{ inputs.maven-version }}
          cache-enabled: ${{ inputs.cache-enabled }}

      - name: Build
        uses: mapfre-tech/action-java-maven/install@v1
        with:
          workspace: ${{ inputs.source-folder }}
          extra-args: ${{ inputs.java-extra-args }} 
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Unit Test
        if: ${{ !inputs.skip-tests }}
        uses: mapfre-tech/action-java-maven/junit@v1
        with:
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Read POM
        id: read-pom
        uses: mapfre-tech/action-java-maven/read-pom@v1
        with:
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
          workspace: ${{ inputs.source-folder }}

      - name: Resolve image name
        id: resolve-image-name
        env:
          COMPONENT_NAME_OVERRIDE: ${{ inputs.component-name }}
          ARTIFACT_ID: ${{ steps.read-pom.outputs.artifactId }}
        run: |
          if [ -n "$COMPONENT_NAME_OVERRIDE" ]; then
            image_name="$COMPONENT_NAME_OVERRIDE"
          else
            image_name="$ARTIFACT_ID"
          fi
          echo "image-name=$image_name" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        if: ${{ fromJson(env.SONAR_CONFIGURED) }}
        uses: mapfre-tech/action-java-maven/setup@v1
        with:
          java-version: '17'
          jdk-distribution: ${{ inputs.jdk-distribution }}
          maven-version: ${{ inputs.maven-version }}
          cache-enabled: ${{ inputs.cache-enabled }}
      # TODO reemplazar con https://github.com/mapfre-tech/action-azure/pull/36
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: acrmapfredevops.azurecr.io
          username: ${{ secrets.ACR_TOKEN_USER }}
          password: ${{ secrets.ACR_TOKEN_PW }}  

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: docker/Dockerfile
          push: false
          tags: ${{ steps.resolve-image-name.outputs.image-name }}:test
          build-args: |
            pomversion=${{ steps.read-pom.outputs.version }}

      # Upload files generated at Build/Test phase and required for sonar scanner step
      - name: "Upload Build/Test Generated Files"
        uses: actions/upload-artifact@v7
        with:
          name: "required-sonar-scanner-generated-files"         
          path: |
            ${{ inputs.source-folder }}/target
          retention-days: 1

  # Code Quality/Sonar job
  code-quality:
    name: Code Quality (Sonar)
    needs: pull-request
    if: fromJSON(needs.pull-request.outputs.sonar-project-configured)
    runs-on: ${{ fromJSON(inputs.runs-on-sonar) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6  

      - name: "Download Build/Test Generated Files"
        uses: actions/download-artifact@v6
        with:
          name: "required-sonar-scanner-generated-files"
          path: ${{ inputs.source-folder }}/target

      - name: SonarQube Scanner - Maven
        if: ${{ fromJson(env.SONAR_CONFIGURED) }}
        continue-on-error: ${{ inputs.sonar-continue-on-error}}
        uses: mapfre-tech/action-sonarqube/scanner-maven@v1
        with:
            hostURL: ${{ inputs.sonar-host-url }}
            projectKey: ${{ inputs.sonar-project-key }}
            projectName: ${{ inputs.sonar-project-name }}
            projectBaseDir: '${{ inputs.source-folder }}'
            authToken: ${{ secrets.SONAR_TOKEN }}
            checkQualityGate: 'true'
            azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
            azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
            scanMetadataReportFile: 'target/sonar/report-task.txt'
            rootCert: ${{ secrets.SONAR_ROOT_CERT }}
