#
# Merge Commit Workflow. Triggers when:
#   - A pull request to develop is closed and merged
#   - A pull request to main is closed and merged
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER    (Organization)
#   - AZURE_ARTIFACTS_PW      (Organization)
#   - ACR_TOKEN_USER          (Organization)
#   - ACR_TOKEN_PW            (Organization)
#   - RAM_GITHUB_GIT_TOKEN    (Repository)
name: Merge Commit
run-name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact #${{ github.run_number }}"

on:   
  workflow_call:
    inputs:
      acr-folder:
        description: 'ACR Folder'
        required: true
        type: string
        default: ''
      next-snapshot-create-pull-request:
        description: 'Create Pull Request to develop'
        required: false
        type: boolean
        default: true
      node-version:
        description: 'Node Version'
        required: false
        type: string
        default: '22'
      source-folder:
        description: 'Source Folder'
        required: false
        type: string
        default: 'source/app'
    secrets:
      AZURE_ARTIFACTS_USER: 
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW: 
        description: 'Password Azure Artifacts'
        required: true
      ACR_TOKEN_USER: 
        description: 'User ACR' 
        required: true
      ACR_TOKEN_PW:
        description: 'Password ACR'
        required: true
      RAM_GITHUB_GIT_TOKEN: 
        description: 'GitHub Token for creating Pull Request to develop'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false     
env:
  # Merge to main/master (base_ref)
  IS_RELEASE: ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') }}  

jobs:

  # Generate centralized tokens if needed
  token-generate:
   #https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-your-pull_request_target-workflow-when-a-pull-request-merges
   if: ${{ github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }} 
   uses: ./.github/workflows/token-generate.yml  
   with:
      profile: 'deployer'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.RAM_GITHUB_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
     needs: token-generate
     uses: ./.github/workflows/validate-workflow.yml
     with:
        workflow_file: 'merge-commit.yml'
        schema: 'container.node.merge-commit.schema.yml'
        centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
     secrets:
        GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.RAM_GITHUB_GIT_TOKEN }}
        GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}
          
  merge:
    needs: [ init, token-generate ]
    name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact"
    runs-on: ubuntu-latest

    steps:
      - name: Decrypt token
        if: needs.token-generate.outputs.centralized-tokens == 'true'
        id: decrypt
        uses: mapfre-tech/action-ci-token/decrypt@v1
        with:
            token: ${{ needs.token-generate.outputs.token }}
            gh_token_encryption_passphrase: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}
    
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

    # read version from package.json
      - name: Read version
        id: read-version
        uses: mapfre-tech/action-utils/get-json-attribute@v1
        with:
          file: ./${{ inputs.source-folder }}/package.json
          attribute: version

      # Sanitize the version tag
      - name: Sanitize version tag
        id: sanitize-version
        run: echo "tag=$(echo ${{ steps.read-version.outputs.value }} | sed 's/[^a-zA-Z0-9_.-]/-/g')" >> $GITHUB_OUTPUT

        # read name from package.json
      - name: Read name
        id: read-name
        uses: mapfre-tech/action-utils/get-json-attribute@v1
        with:
          file: ./${{ inputs.source-folder }}/package.json
          attribute: name
        
        # Run 'npm ci' on .
      - name: Install dependencies
        uses: mapfre-tech/action-npm/ci@v1
        with:
          working_directory: ${{ inputs.source-folder }}
          feed: 'releases'
          azure_npm_secret: ${{ secrets.AZURE_ARTIFACTS_PW }}
               
        # Prepare release -> set package.json release version
      - name: Prepare release
        id: npm-next-release-version
        if: fromJson(env.IS_RELEASE)      
        uses: mapfre-tech/action-npm/next-release-version@v1
        with:
            current-version: ${{ steps.read-version.outputs.value}}
            working-directory: ./${{ inputs.source-folder }}            
     
      - name: Build
        uses: mapfre-tech/action-npm/build@v1
        with:
          working_directory: ${{ inputs.source-folder }}
      
        # Package artifact: zip . 
      - name: Package Artifact
        id: package-artifact
        uses: mapfre-tech/action-fileutils/zip@v1
        with:          
          output-path: publish_artifact
          exclude: '.git/\* .github/\* .img/\* cicd/\* docker/\* **/node_modules/\* **/src/\* **/test/\* **/eslint.config.ts **/jest.config.ts **/tsconfig.json **/.gitignore .gitignore catalog-info.yaml'
    
        # Determine Snapshot version based on current version + suffix (Run Number)
      - name: Snapshot version
        id: get-snapshot-version
        if: ${{ !fromJson(env.IS_RELEASE) }}
        run: |          
          echo "version=${{ format('{0}.{1}', steps.read-version.outputs.value,  github.run_number) }}" >> $GITHUB_OUTPUT
      
        
        # Publish Snapshot artifact
      - name: Publish Snapshot Artifact
        if: ${{ !fromJson(env.IS_RELEASE) }}
        uses: mapfre-tech/action-azure-artifacts/publish-package@v1
        with:
          feed: snapshots
          packageName: ${{ steps.read-name.outputs.value }}
          version:   ${{ steps.get-snapshot-version.outputs.version }}
          path: publish_artifact
          description: "${{ steps.read-name.outputs.value }} ${{ steps.get-snapshot-version.outputs.version }} snapshot"
          azure-devops-pat: ${{ secrets.AZURE_ARTIFACTS_PW }}


        # Publish Release artifact
      - name: Publish Release Artifact
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-azure-artifacts/publish-package@v1
        with:
          feed: releases
          packageName: ${{ steps.read-name.outputs.value }}
          version:  ${{ steps.npm-next-release-version.outputs.nextVersion }}
          path: publish_artifact
          description: "${{ steps.read-name.outputs.value }} ${{ steps.npm-next-release-version.outputs.nextVersion }} release"
          azure-devops-pat: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Build and publish image        
        uses: mapfre-tech/action-azure/push@v1
        with:
          acr-token-user: ${{ secrets.ACR_TOKEN_USER }}
          acr-token-pass: ${{ secrets.ACR_TOKEN_PW }}
          image: ${{ steps.read-name.outputs.value }}
          acr-folder: ${{ inputs.acr-folder }}
          dockerfile-path: docker/Dockerfile
          context: .
          tag: ${{ (fromJson(env.IS_RELEASE) && steps.npm-next-release-version.outputs.nextVersion) || steps.sanitize-version.outputs.tag }}
      - name: Release Promotion (Commit & Push package.json)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: ./${{ inputs.source-folder }}/package.json
          message: Promotion to RELEASE completed version (${{ steps.npm-next-release-version.outputs.nextVersion }})
          branch: ${{github.base_ref}}            

        # Git tag and push
      - name: Tag Git Repository
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/tag-push@v1
        with:
          tag: ${{ steps.npm-next-release-version.outputs.nextVersion }}
          message: "${{ steps.read-name.outputs.value }} ${{ steps.npm-next-release-version.outputs.nextVersion }}"

        # Prepare next iteration
      - name: Next Snapshot (Set next version in package.json)
        id: next-snapshot
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-npm/next-dev-version@v1
        with:          
          new-version: ${{ steps.npm-next-release-version.outputs.nextVersion }}
          dev-identifier: snapshot      
          working-directory: ./${{ inputs.source-folder }}
        
        # Commit package.json
      - name: Next Snapshot (Git Commit & Push package.json)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: ./${{ inputs.source-folder }}/package.json
          message: promotion to next development version (${{ steps.next-snapshot.outputs.nextVersion }}) completed
          branch: ${{github.base_ref}}
          create-pull-request: ${{ inputs.next-snapshot-create-pull-request }} 
          pull-request-title: Next development version (${{ steps.next-snapshot.outputs.nextVersion }})
          github-token: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}

    outputs:
      published-version: ${{ steps.get-snapshot-version.outputs.version }}

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ token-generate, merge ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}