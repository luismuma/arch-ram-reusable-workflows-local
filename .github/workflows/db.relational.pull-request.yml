name: PR workflow
run-name: "Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

on:  
  workflow_call:
    inputs:
      sonar-project-key: 
        description: 'Sonar Project Key'
        required: false
        type: string
        default: ''
      sonar-project-name:
        description: 'Sonar Project Name'
        required: false
        type: string
        default: ''    
      sonar-host-url:
        description: 'Sonar Host URL'
        required: false
        type: string
        default: 'https://codereview.azure.mapfre.com'
      sonar-params:
        description: 'Sonar scanner CLI params'
        required: false
        type: string
        default: '-Dsonar.qualitygate.wait=false -Dsonar.sourceEncoding=UTF-8 -Dsonar.sources=sources'
      runs-on-sonar:
        description: 'runs-on to use for Sonar job. Example: ["ubuntu-latest"], ["self-hosted", "mar", "dev"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'
      manifest-file:
        description: 'Manifest file'
        required: false
        type: string
        default: 'project-manifest.json'
      log-level:
        description: 'Liquibase Log Level'
        required: false
        type: string
        default: 'INFO'
      strict:
        description: 'Liquibase Strict Mode'
        required: false
        type: boolean
        default: true
      context-filter:
        description: 'Liquibase Context'
        required: false
        type: string
        default: ''
    secrets:
      AZURE_ARTIFACTS_USER: 
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW: 
        description: 'Password Azure Artifacts'
        required: true  
      SONAR_TOKEN:
        description: 'Sonar Token'
        required: false  
      GH_GIT_TOKEN:
        description: 'GitHub Token for checking out the code'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false

env:  
  ROOT_CONFIG: |
    {
      "mysql": {
        "image": "mysql:8.0",
        "driver_group_id": "com.mysql",
        "driver_artifact_id": "mysql-connector-j",
        "driver_version": "8.1.0",
        "driver": "com.mysql.cj.jdbc.Driver",
        "url_prefix": "jdbc:mysql://",
        "port": "3306",
        "system_user": "root",
        "health_cmd": "mysqladmin ping"
      },
      "postgresql": {
        "image": "postgres:16.8",
        "url_prefix": "jdbc:postgresql://",
        "port": "5432",
        "system_user": "root",
        "health_cmd": "pg_isready"
      },
      "oracle": {
        "image": "gvenzl/oracle-free:23-slim",
        "driver_group_id": "com.oracle.database.jdbc",
        "driver_artifact_id": "ojdbc11",
        "driver_version": "23.3.0.23.09",
        "driver": "oracle.jdbc.OracleDriver",
        "url_prefix": "jdbc:oracle:thin:@",
        "port": "1521",
        "system_user": "system",
        "health_cmd": "healthcheck.sh"
      },
      "db2": {
        "image": "icr.io/db2_community/db2:11.5.8.0",
        "driver_group_id": "com.ibm.db2",
        "driver_artifact_id": "jcc",
        "driver_version": "11.5.8.0",
        "driver": "com.ibm.db2.jcc.DB2Driver",
        "url_prefix": "jdbc:db2://",
        "port": "50000",
        "system_user": "db2inst1",
        "health_cmd": "test -f /database/config/.shared-data/setup_complete",
        "options": "--privileged"
      }
    }

jobs:

  # Generate centralized tokens if needed
  token-generate:
   if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
   uses: ./.github/workflows/token-generate.yml 
   with:
      profile: 'reader'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
     needs: token-generate
     uses: ./.github/workflows/validate-workflow.yml
     with:
        workflow_file: 'pull-request.yml'
        schema: 'db.relational.pull-request.schema.yml'
        centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
     secrets:
        GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.GH_GIT_TOKEN }}
        GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ pull-request, token-generate ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  prepare:
    needs: [init, token-generate]
    name:  Prepare Test 
    runs-on: ubuntu-latest   
    outputs:
      matrix: ${{ steps.create-config.outputs.matrix }}      
    steps:    

      - name: Decrypt token
        if: needs.token-generate.outputs.centralized-tokens == 'true'
        id: decrypt
        uses: mapfre-tech/action-ci-token/decrypt@v1
        with:
            token: ${{ needs.token-generate.outputs.platform-token }}
            gh_token_encryption_passphrase: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}
     
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate ${{inputs.manifest-file}} (JSON Schema)
        uses: mapfre-tech/action-validation-schema/json@v1
        with:             
            schema: json-schemas/db.relational.project-manifest.schema.json
            schema-repository: mapfre-tech/arch-ram-reusable-workflows
            schema-repository-ref: ${{ needs.init.outputs.workflow_ref }}
            token: ${{ steps.decrypt.outputs.token || secrets.GH_GIT_TOKEN }}
            files: ${{inputs.manifest-file}}

      - name: Policy Checks
        uses: mapfre-tech/action-liquibase-policy-check@v1
        with:
          check-tag-database: true
          check-rollback: true
          sources: sources
          only-warning: false
          
      - name: Create config matrix
        id: create-config
        run: |
          # Read the JSON files into variables
          COMPONENTS=$(<"${{inputs.manifest-file}}")       

          DATABASES=$(jq -c -n --argjson components "$COMPONENTS" --argjson rc "$ROOT_CONFIG" '
              $components.databases | to_entries | map(
                  . + { root_config: ($rc[.value.type] // {}) } | {
                      path: .key,
                      type: .value.type,
                      dbname: .value.dbname,
                      image: (.root_config.image // ""),
                      driver_group_id: (.value.driver_group_id // .root_config.driver_group_id // ""),
                      driver_artifact_id: (.value.driver_artifact_id // .root_config.driver_artifact_id // ""),
                      driver_version: (.value.driver_version // .root_config.driver_version // ""),
                      driver: (.value.driver // .root_config.driver // ""),
                      classpath: (
                          if (.value.driver_artifact_id // .root_config.driver_artifact_id) and (.value.driver_version // .root_config.driver_version) then
                              "./packages/lib/" + (.value.driver_artifact_id // .root_config.driver_artifact_id) + "-" + (.value.driver_version // .root_config.driver_version) + ".jar"
                          else ""
                          end
                      ),
                      url_prefix: (.root_config.url_prefix // ""),
                      port: (.root_config.port // ""),
                      system_user: (.root_config.system_user // ""),
                      health_cmd: (.root_config.health_cmd // ""),
                      options: (.root_config.options // "")
                  }
              )
          ')
          echo "matrix={\"database\": $DATABASES }" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  pull-request:
    needs: [prepare, token-generate]
    name: Test (${{matrix.database.path}}/${{matrix.database.type}})
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      max-parallel: 10
      fail-fast: false
    outputs:
      sonar-project-configured: ${{ inputs.sonar-project-key != '' && inputs.sonar-project-name != '' }}
    env:        
      DB_ROOT_PASSWORD: rootpassword
      URL: ${{ format('{0}test-db:{1}/{2}', matrix.database.url_prefix , matrix.database.port,  matrix.database.dbname) }}
    services:
      test-db:      
        image: ${{ matrix.database.image }}
        env:
          # For MySQL
          MYSQL_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{matrix.database.dbname}}
          MYSQL_USER: user
          MYSQL_PASSWORD: password
          # For PostgreSQL
          POSTGRES_DB:  ${{matrix.database.dbname}}
          POSTGRES_USER: ${{ matrix.database.system_user}}
          POSTGRES_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          # For DB2          
          LICENSE: accept
          DB2INST1_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          DBNAME: ${{matrix.database.dbname}}
          #DB2INSTANCE: db2inst1
          # For Oracle
          ORACLE_DATABASE : ${{matrix.database.dbname}}
          ORACLE_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}      
        ports: 
          - ${{ matrix.database.port  }}
        options: >-
          ${{matrix.database.options}}
          --health-cmd="${{matrix.database.health_cmd}}" 
          --health-interval=10s 
          --health-timeout=10s 
          --health-retries=20

    steps:
    
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download driver ${{ matrix.database.driver_artifact_id }}-${{ matrix.database.driver_version }}.jar
        if: matrix.database.driver_group_id != ''
        env:       
          GROUP_ID: ${{ matrix.database.driver_group_id }}
          ARTIFACT_ID: ${{ matrix.database.driver_artifact_id }}
          VERSION: ${{ matrix.database.driver_version }}
        run: |
          mkdir -p ./packages/lib 
          GROUP_PATH=$(echo ${GROUP_ID} | sed 's/\./\//g')
          URL="https://pkgs.dev.azure.com/devopsmapfre/devopsmapfre/_packaging/releases/maven/v1/${GROUP_PATH}/${ARTIFACT_ID}/${VERSION}/${ARTIFACT_ID}-${VERSION}.jar"
          curl -f -u "${{secrets.AZURE_ARTIFACTS_USER}}:${{secrets.AZURE_ARTIFACTS_PW}}" -o "${{ matrix.database.classpath }}" "${URL}"

      - name: liquibase validate
        uses: liquibase-github-actions/validate@v4.33.0
        with:          
          driver: ${{ matrix.database.driver }}
          classpath: ${{ matrix.database.classpath }}
          changelogFile: /sources/${{ matrix.database.path }}/master.xml
          username: ${{ matrix.database.system_user}}
          password: ${{ env.DB_ROOT_PASSWORD }}
          url: ${{ env.URL }}
          headless: true        
          logLevel: ${{ inputs.log-level }}
          strict: ${{ inputs.strict }}
          contextFilter: ${{ inputs.context-filter }}

      - name: liquibase update-testing-rollback
        uses: liquibase-github-actions/update-testing-rollback@v4.33.0
        with:
          driver: ${{ matrix.database.driver }}
          classpath:  ${{ matrix.database.classpath }}
          changelogFile: /sources/${{ matrix.database.path }}/master.xml
          username: ${{ matrix.database.system_user}}
          password: ${{ env.DB_ROOT_PASSWORD }}
          url: ${{ env.URL }}
          headless: true        
          logLevel: ${{ inputs.log-level }}
          strict: ${{ inputs.strict }}
          contextFilter: ${{ inputs.context-filter }}

      - name: liquibase history
        uses: liquibase-github-actions/history@v4.33.0
        with:
          driver: ${{ matrix.database.driver }}
          classpath:  ${{ matrix.database.classpath }}          
          username: ${{ matrix.database.system_user}}
          password: ${{ env.DB_ROOT_PASSWORD }}
          url: ${{ env.URL }}
          headless: true        
          logLevel: ${{ inputs.log-level }}          

  # Code Quality/Sonar job
  code-quality:
    name: Code Quality (Sonar)
    needs: pull-request
    if: fromJSON(needs.pull-request.outputs.sonar-project-configured)
    runs-on: ${{ fromJSON(inputs.runs-on-sonar) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: SonarQube Scanner - CLI
        id: scanner-cli
        uses: mapfre-tech/action-sonarqube/scanner-cli@v1
        with:
          hostURL: ${{ inputs.sonar-host-url }}
          projectKey: ${{ inputs.sonar-project-key }}
          projectName: ${{ inputs.sonar-project-name }}
          authToken: ${{ secrets.SONAR_TOKEN }}
          checkQualityGate: 'true'
          params: ${{ inputs.sonar-params }}