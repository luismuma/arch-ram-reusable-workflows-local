name: Pull Request
run-name: "Build and Test #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

on:
  workflow_call:
    inputs:
      sonar-host-url:
        description: 'Sonar Host URL'
        required: false
        type: string
        default: ''
      sonar-project-key: 
        description: 'Sonar Project Key'
        required: false
        type: string
        default: ''
      sonar-project-name:
        description: 'Sonar Project Name'
        required: false
        type: string
        default: ''
      sonar-version:
        description: 'Sonar Scanner CLI version'
        required: false
        type: string
        default: '10.0'
      sonar-params:
        description: 'Sonar scanner CLI params'
        required: false
        type: string
        default: '-Dsonar.qualitygate.wait=false -Dsonar.sourceEncoding=UTF-8 -Dsonar.python.coverage.reportPaths=coverage.xml -Dsonar.sources=.'
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'
      dependency-index-url:
        description: 'Additional Python package index URL (optional)'
        required: false
        type: string
        default: ''
      runs-on-sonar:
        description: 'runs-on to use for Sonar job. Example: ["ubuntu-latest"], ["self-hosted", "mar", "dev"]'
        required: false
        type: string
        default: '["ubuntu-latest"]'

    secrets:
      SONAR_TOKEN:
        description: 'Sonar Token'
        required: false
      ACR_TOKEN_USER: 
        description: 'User ACR' 
        required: true
      ACR_TOKEN_PW:
        description: 'Password ACR'
        required: true
      RAM_GITHUB_GIT_TOKEN:
        description: 'GitHub Token for checking out the code'
        required: false
      AZURE_ARTIFACTS_USER: 
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW: 
        description: 'Password Azure Artifacts'
        required: true
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: \'Passphrase for centralized token generation\'
        required: false

jobs:

  # Generate centralized tokens if needed
  token-generate:
   if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
   uses: ./.github/workflows/token-generate.yml 
   with:
      profile: 'reader'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.RAM_GITHUB_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
     needs: token-generate
     uses: ./.github/workflows/validate-workflow.yml
     if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
     with:
        workflow_file: 'pull-request.yml'
        schema: 'lib.python.pull-request.schema.yml'
        centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
     secrets:
        GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.RAM_GITHUB_GIT_TOKEN }}
        GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}
  
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ token-generate, init ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}



  pull-request:
    name: Build and Test
    if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
    runs-on: ubuntu-latest
    outputs:
      sonar-project-configured: ${{ inputs.sonar-project-key != '' && inputs.sonar-project-name != '' }}  
    steps:
     
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Configure pip index (optional)
        if: ${{ inputs.dependency-index-url != '' }}
        run: |
          python -m pip config set global.extra-index-url "${{ inputs.dependency-index-url }}"

      - name: Install dependencies
        run: |
          python -m pip install -e .[dev]
      
      # Run tests from root to generate relative paths in coverage report
      - name: Test
        run: |
          pytest --cov-report=xml:coverage.xml
          coverage report -m

      # Upload files generated at Build/Test phase and required for sonar scanner step
      - name: "Upload Build/Test Generated Files"
        uses: actions/upload-artifact@v5
        with:
          name: "required-sonar-scanner-generated-files"
          path: |
            coverage.xml
          retention-days: 1

      # Build package
      - name: Build package
        run: |
          python -m build

  code-quality:
    name: Code Quality (Sonar)
    needs: pull-request
    if: fromJSON(needs.pull-request.outputs.sonar-project-configured)
    runs-on: ubuntu-latest
    container:
      image: acrmapfredevops.azurecr.io/mapfre/global/sonar-scanner-cli:${{ inputs.sonar-version }}
      options: --user root
      credentials:
        username: ${{ secrets.ACR_TOKEN_USER}}
        password: ${{ secrets.ACR_TOKEN_PW }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5  

      - name: "Download Build/Test Generated Files"
        uses: actions/download-artifact@v6
        with:
          name: "required-sonar-scanner-generated-files"
          path: target

      - name: SonarQube Scanner - CLI
        id: scanner-cli
        continue-on-error: true
        uses: mapfre-tech/action-sonarqube/scanner-cli@v1
        with:
          hostURL: ${{ inputs.sonar-host-url }}
          projectKey: ${{ inputs.sonar-project-key }}
          projectName: ${{ inputs.sonar-project-name }}
          authToken: ${{ secrets.SONAR_TOKEN }}
          checkQualityGate: 'true'
          params: ${{ inputs.sonar-params }}
