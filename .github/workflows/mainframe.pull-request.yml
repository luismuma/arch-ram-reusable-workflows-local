# Copyright (c) MAPFRE DevOps Platform
#
# Pull Request Workflow. Triggers when:
#   - A pull request from feature to develop is created / synchronized
#   - A pull request from hotfix to main is created / synchronized
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER    (Organization)
#   - AZURE_ARTIFACTS_PW      (Organization)
#   - SONAR_TOKEN             (Repository) Secret with the SonarQube token
#   - GH_GIT_TOKEN            (Repository)

name: PR workflow
run-name: "Build and Deploy #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

on:
  workflow_call:
    inputs:
      sonar-project-key:
        description: "Sonar Project Key"
        required: false
        type: string
        default: ""
      sonar-project-name:
        description: "Sonar Project Name"
        required: false
        type: string
        default: ""
      sonar-host-url:
        description: "Sonar Host URL"
        required: false
        type: string
        default: "https://enterprise.qa.es.pre.emea.aws.mapfre.net"
      runs-on-sonar:
        description: "runs-on to use for Sonar job. Example: [\"ubuntu-latest\"],
          [\"self-hosted\", \"mar\", \"dev\"]"
        required: false
        type: string
        default: "[\"self-hosted\", \"mar\", \"dev\"]"        
      runs-on-pull-request:
        description: "runs-on to use for pull request job. Example: [\"ubuntu-latest\"],
          [\"self-hosted\", \"mar\", \"dev\"]"
        required: false
        type: string
        default: "[\"self-hosted\", \"mar\", \"dev\"]"
      rse_user:
        description: "Zos Mainframe User"
        type: string
        required: true     
    secrets:
      AZURE_ARTIFACTS_USER:
        description: "User Azure Artifacts"
        required: false
      AZURE_ARTIFACTS_PW:
        description: "Password Azure Artifacts"
        required: false
      SONAR_TOKEN:
        description: "Sonar Token"
        required: false
      SONAR_ROOT_CERT:
        description: "Sonar Root Certificate"
        required: false
      GH_GIT_TOKEN:
        description: "GitHub Token for checking out the code"
        required: false        
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false
      APP_GHZOS_PW:
        description: "Zos Mainframe Password"
        required: true
      ACR_TOKEN_USER:
        required: true
      ACR_TOKEN_PW:
        required: true

jobs:

  # Generate centralized tokens if needed
  token-generate:
   if: ( contains(github.event.pull_request.head.ref, 'feature/') || contains(github.event.pull_request.head.ref, 'hotfix/') )
   uses: ./.github/workflows/token-generate.yml 
   with:
      profile: 'reader'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
    needs: token-generate
    uses: ./.github/workflows/validate-workflow.yml
    with:
      workflow_file: "pull-request.yml"
      schema: "mainframe.pull-request.schema.yml"
      centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
    secrets:      
      GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.GH_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ init, token-generate ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  pull-request:
    name: Build and Test
    needs: init
    runs-on: ${{ fromJson(inputs.runs-on-pull-request) }}
    container:
      image: acrmapfredevops.azurecr.io/mapfre/arch/ram/zowe-cli:dev
      credentials:
        username: ${{ secrets.ACR_TOKEN_USER }}
        password: ${{ secrets.ACR_TOKEN_PW }}
      options: --user root
    outputs:
      sonar-project-configured: ${{ inputs.sonar-project-key != '' && inputs.sonar-project-name != '' }}

    env:
      RSE_USER: ${{ inputs.rse_user }}
      APP_GHZOS_PW: ${{ secrets.APP_GHZOS_PW }}
      HOME: /home/zowe
      ZOWE_CLI_HOME: /home/zowe/.zowe
      WORKSPACE: /usr/lpp/IDZ/github/workspace

    steps:
      - name: Prepare environment (DBus, Keyring, Safe Branch Name)
        shell: bash
        run: |
          export $(dbus-launch)
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> $GITHUB_ENV
          echo "DBUS_SESSION_BUS_PID=$DBUS_SESSION_BUS_PID" >> $GITHUB_ENV
          echo "" | gnome-keyring-daemon -r --unlock --components=secrets 2>/dev/null

      - name: Check & Obtain JWT to mainframe
        shell: bash
        run: |
          for i in 1 2 3; do
            timeout 10s zowe rse check status --user "$RSE_USER" --password "$APP_GHZOS_PW" \
            && timeout 10s zowe rse auth login --user "$RSE_USER" --password "$APP_GHZOS_PW" \
            && break
            [ "$i" -eq 3 ] && exit 1
            sleep 10
          done

      - name: Logout and remove JWT
        if: always()
        run: |
          zowe rse auth logout

  # Code Quality/Sonar job
  code-quality:
    name: Code Quality (Sonar)
    needs: pull-request
    if: ${{ inputs.sonar-project-key != '' && inputs.sonar-project-name != '' }}
    runs-on: ${{ fromJson(inputs.runs-on-sonar) }}
    container:
      image: acrmapfredevops.azurecr.io/mapfre/global/sonar-scanner-cli:10.0
      options: --user root
      credentials:
        username: ${{ secrets.ACR_TOKEN_USER }}
        password: ${{ secrets.ACR_TOKEN_PW }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: SonarQube Scanner
        uses: mapfre-tech/action-sonarqube/scanner-cli@v1
        with:
          projectKey: ${{ inputs.sonar-project-key }}
          projectName: ${{ inputs.sonar-project-name }}
          authToken: ${{ secrets.SONAR_TOKEN }}
          hostURL:  ${{ inputs.sonar-host-url }}
          rootCert: ${{ secrets.SONAR_ROOT_CERT }}
          projectBaseDir: "."
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}          


