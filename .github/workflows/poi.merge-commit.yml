#
# Merge Commit Workflow. Triggers when:
#   - A pull request to develop is closed and merged
#   - A pull request to main is closed and merged
#
# Required secrets:
#   - AZURE_ARTIFACTS_USER    (Organization)
#   - AZURE_ARTIFACTS_PW      (Organization)
#   - RAM_GITHUB_GIT_TOKEN    (Repository)

name: Merge Commit
run-name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact #${{ github.run_number }}"

on:   
  workflow_call:
    inputs:
      java-version:
        description: 'Java Version'
        required: false
        type: string
        default: '21'
      java-extra-args:
        description: 'Java Extra Args'
        required: false
        type: string
        default: '-Dsource.skip -DskipTests -Dcobertura.skip'
      jdk-distribution:
        description: 'JDK Distribution'
        required: false
        type: string
        default: 'temurin'
      maven-version:
        description: 'Maven Version'
        required: false
        type: string
        default: '3.9.6'
      cache-enabled:
        description: 'Cache Enabled'
        required: false
        type: boolean
        default: true
      source-folder:
        description: 'Source Folder'
        required: false
        type: string
        default: 'sources'
      next-snapshot-create-pull-request:
        description: 'Create Pull Request to develop'
        required: false
        type: boolean
        default: false
      is-fix:
        description: 'Indicates if the promotion is for a fix version'
        required: false
        type: boolean
        default: false
      create-snapshot-tag:
        description: 'Create or overwrite a SNAPSHOT tag on develop merges (e.g. 1.2.0-SNAPSHOT)'
        required: false
        type: boolean
        default: false
    secrets:
      AZURE_ARTIFACTS_USER: 
        description: 'User Azure Artifacts' 
        required: true
      AZURE_ARTIFACTS_PW: 
        description: 'Password Azure Artifacts'
        required: true
      RAM_GITHUB_GIT_TOKEN: 
        description: 'GitHub Token for creating Pull Request to develop'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false
env:
  # Merge to main/master (base_ref)
  IS_RELEASE: ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') }}

jobs:

  # Generate centralized tokens if needed
  token-generate:
   #https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#running-your-pull_request_target-workflow-when-a-pull-request-merges
   if: ${{ github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }}
   uses: ./.github/workflows/token-generate.yml  
   with:
      profile: 'deployer'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.RAM_GITHUB_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  init:
    needs: token-generate
    uses: ./.github/workflows/validate-workflow.yml
    with:
     workflow_file: 'merge-commit.yml'
     schema: 'poi.merge-commit.schema.yml'
     centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
    secrets:
      GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.RAM_GITHUB_GIT_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  merge:
    if: ${{ github.event.pull_request.merged == true && !startsWith(github.head_ref , 'release/branch--') }}
    needs: [ init, token-generate ]
    name: "Generate ${{ fromJson(github.base_ref == 'main' || github.base_ref == 'master') && 'Release' || 'Snapshot' }} Artifact"
    runs-on: ubuntu-latest
    steps:

      - name: Decrypt token
        if: needs.token-generate.outputs.centralized-tokens == 'true'
        id: decrypt
        uses: mapfre-tech/action-ci-token/decrypt@v1
        with:
            token: ${{ needs.token-generate.outputs.token }}
            gh_token_encryption_passphrase: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          token: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}

      - name: Setup Java/Maven
        uses: mapfre-tech/action-java-maven/setup@v1
        with:
          java-version: ${{ inputs.java-version }}
          jdk-distribution: ${{ inputs.jdk-distribution }}
          maven-version: ${{ inputs.maven-version }}
          cache-enabled: ${{ inputs.cache-enabled }}

      - name: Prepare Promotion 
        id: prepare-promotion
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-java-maven/promotion@v1
        with:
          branch: ${{github.base_ref}}
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
          is-fix: ${{ inputs.is-fix }}

      - name: Build
        uses: mapfre-tech/action-java-maven/package@v1
        with:
          workspace: ${{ inputs.source-folder }}
          extra-args: ${{ inputs.java-extra-args }} 
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Publish
        uses: mapfre-tech/action-java-maven/publish@v1
        with:
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Read POM
        id: read-pom
        uses: mapfre-tech/action-java-maven/read-pom@v1
        with:
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}

      - name: Snapshot Tag (Commit & Push pom.xml)
        if: ${{ !fromJson(env.IS_RELEASE) && inputs.create-snapshot-tag }}
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: ${{ inputs.source-folder }}/pom.xml
          message: Set commit hash for SNAPSHOT tag (${{ steps.read-pom.outputs.version }})
          branch: ${{ github.base_ref }}

      - name: Snapshot Tag (Tag Git Repository)
        if: ${{ !fromJson(env.IS_RELEASE) && inputs.create-snapshot-tag }}
        run: |
          git tag -f "${{ steps.read-pom.outputs.version }}"
          git push origin -f "refs/tags/${{ steps.read-pom.outputs.version }}"

      - name: Release Promotion (Commit & Push pom.xml)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: ${{ inputs.source-folder }}/pom.xml
          message: Promotion to RELEASE completed version (${{ steps.read-pom.outputs.version }})
          branch: ${{github.base_ref}}


      - name: Release Promotion (Tag Git Repository)
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/tag-push@v1
        with:
          tag: ${{ steps.read-pom.outputs.version }}
          message: "New version tag ${{ steps.read-pom.outputs.version }}"


      - name: Next Snapshot Promotion (Set next version in pom.xml)
        id: next-snapshot-promotion
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-java-maven/promotion@v1
        with:
          branch: develop
          workspace: ${{ inputs.source-folder }}
          azure-artifact-user: ${{ secrets.AZURE_ARTIFACTS_USER }}
          azure-artifact-pw: ${{ secrets.AZURE_ARTIFACTS_PW }}
          is-fix: ${{ inputs.is-fix }}

      - name: Next Snapshot Promotion (Commit & Push to main)
        id: next-snapshot-commit
        if: fromJson(env.IS_RELEASE)
        uses: mapfre-tech/action-git/commit-push@v1
        with:
          filename: ${{ inputs.source-folder }}/pom.xml
          message: Promotion to next SNAPSHOT completed (${{ steps.next-snapshot-promotion.outputs.version }})
          branch: ${{ github.base_ref }}
          create-pull-request: ${{ inputs.next-snapshot-create-pull-request }}
          pull-request-title: Next development version (${{ steps.next-snapshot-promotion.outputs.version }})
          github-token: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}

      - name: Next Snapshot Promotion (Direct commit to develop)
        if: fromJson(env.IS_RELEASE) && !fromJson(inputs.next-snapshot-create-pull-request)
        run: |
          git show HEAD:${{ inputs.source-folder }}/pom.xml > /tmp/next-snapshot-pom.xml
          git fetch origin
          git checkout develop
          git pull
          cp /tmp/next-snapshot-pom.xml ${{ inputs.source-folder }}/pom.xml
          git add ${{ inputs.source-folder }}/pom.xml
          git config --local user.name mapfre-github-actions[bot]
          git config --local user.email mapfre-github-actions[bot]@users.noreply.github.com
          git commit -m "Promotion to next SNAPSHOT completed (${{ steps.next-snapshot-promotion.outputs.version }})"
          git push origin develop

      - name: Next Snapshot Promotion (Create PR to develop)
        if: fromJson(env.IS_RELEASE) && fromJson(inputs.next-snapshot-create-pull-request)
        env:
          GH_TOKEN: ${{ steps.decrypt.outputs.token || secrets.RAM_GITHUB_GIT_TOKEN }}
        run: |
          git show HEAD:${{ inputs.source-folder }}/pom.xml > /tmp/next-snapshot-pom.xml
          git fetch origin
          git checkout develop
          git pull
          git checkout -b "release/branch--develop"
          cp /tmp/next-snapshot-pom.xml ${{ inputs.source-folder }}/pom.xml
          git add ${{ inputs.source-folder }}/pom.xml
          git config --local user.name mapfre-github-actions[bot]
          git config --local user.email mapfre-github-actions[bot]@users.noreply.github.com
          git commit -m "Promotion to next SNAPSHOT completed (${{ steps.next-snapshot-promotion.outputs.version }})"
          git push origin "release/branch--develop" --force
          gh pr create \
            --title "Next development version (${{ steps.next-snapshot-promotion.outputs.version }})" \
            --base develop \
            --head "release/branch--develop" \
            --body "" || true

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ token-generate, merge ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}
