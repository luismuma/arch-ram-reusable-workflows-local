# Copyright (c) MAPFRE DevOps Platform
#
# Pull Request Workflow. Triggers when:
#   - A pull request from feature or release to develop is created / synchronized
#   - A pull request from hotfix/develop/release to main is created / synchronized
#
# Required secrets:
#   - GH_GIT_TOKEN    (Repository)

name: PR workflow
run-name: "Pull Request CI for POI #${{ github.run_number }}: ${{ github.event.pull_request.title }}"

on:
  workflow_call:
    inputs:
      source-folder:
        description: 'Project source folder'
        required: false
        type: string
        default: './'
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '21'
      jdk-distribution:
        description: 'JDK distribution to use'
        required: false
        type: string
        default: 'temurin'
      maven-version:
        description: 'Maven version to use'
        required: false
        type: string
        default: '3.9.6'
      cache-enabled:
        description: 'Enable Maven cache'
        required: false
        type: boolean
        default: true
    secrets:
      GH_AUTOMATION_TOKEN:
        description: 'GitHub token with repo scope for creating releases and pushing tags'
        required: false
      GH_TOKEN_ENCRYPTION_PASSPHRASE:
        description: 'Passphrase for decrypting the GitHub token'
        required: false
jobs:

  # Generate centralized tokens if needed
  token-generate:
   uses: ./.github/workflows/token-generate.yml 
   with:
      profile: 'reader'
   secrets:
      EXTERNAL_GITHUB_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  validate-branches:
    name: Validate Branches
    runs-on: ubuntu-latest
    outputs:
      is-valid: ${{ steps.validate.outputs.is-valid }}
    steps:
      - name: Validate branch names
        id: validate
        run: |
          # Validar rama head 'feature/*' o 'release/*' => rama base 'develop', si no => fallo
          if [[ "${{ github.base_ref }}" == "develop" ]]; then
            if ! [[ "${{ github.head_ref }}" =~ ^feature/.+$ || "${{ github.head_ref }}" =~ ^release/.+$ ]]; then
              echo "::error::Invalid head branch: ${{ github.head_ref }}. Only 'feature/*' or 'release/*' is allowed as head branch for PRs to develop"
              echo "is-valid=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

          # Validar rama head 'develop', 'hotfix/*' o 'release/*' => rama base 'main' o 'master', si no => fallo
          if [[ "${{ github.base_ref }}" == "main" || "${{ github.base_ref }}" == "master" ]]; then 
            if ! [[ "${{ github.head_ref }}" == "develop" || "${{ github.head_ref }}" =~ ^release/.+$ || "${{ github.head_ref }}" =~ ^hotfix/.+$ ]]; then
              echo "::error::Invalid base branch: ${{ github.base_ref }}. Only 'main|master' is allowed as base branch for 'develop', 'hotfix/*' or 'release/*' PRs"
              echo "is-valid=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          fi

          echo "Branch validation passed"
          echo "is-valid=true" >> $GITHUB_OUTPUT

  pull-request:
    name: PR Validation
    needs: [validate-branches, token-generate]
    if: needs.validate-branches.outputs.is-valid == 'true'
    uses: ./.github/workflows/validate-workflow.yml
    with:
      workflow_file: 'pull-request.yml'
      schema: 'poi.pull-request.schema.yml'
      centralized-tokens: ${{ fromJson(needs.token-generate.outputs.centralized-tokens) }}
    secrets:
        GH_GIT_TOKEN: ${{ needs.token-generate.outputs.platform-token || secrets.GH_AUTOMATION_TOKEN }}
        GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

  # Revoke tokens if they were generated in this workflow
  revoke-tokens:
    if: always() && needs.token-generate.outputs.centralized-tokens == 'true'
    needs: [ pull-request, token-generate ]
    uses: ./.github/workflows/token-revoke.yml
    secrets:
      TOKEN: ${{ needs.token-generate.outputs.token }}
      PLATFORM_TOKEN: ${{ needs.token-generate.outputs.platform-token }}
      GH_TOKEN_ENCRYPTION_PASSPHRASE: ${{ secrets.GH_TOKEN_ENCRYPTION_PASSPHRASE }}

