type: map
mapping:
  name:
    type: str
    required: true
  run-name:
    type: str
    required: true
  on:
    type: map
    mapping:
      pull_request:
        type: map
        mapping:
          types:
            type: seq
            sequence:
              - type: str
          branches:
            type: seq
            sequence:
              - type: str
  jobs:
    type: map
    mapping:
      merge:
        type: map
        mapping:
          uses:
            type: str
          with:
            type: map
            mapping:
              component_id:
                type: str
                required: false
              description:
                type: str
                required: false
              next-snapshot-create-pull-request:
                type: bool
                required: false
              source-folder:
                type: str
                required: false
              runs-on-merge-commit:
                type: str
                required: false
              manifest-file:
                type: str
                required: false
              application:
                type: str
                required: true             
              rse_user:
                type: str
                required: true              
              forceFullBuildScanOnly:
                type: bool
                required: false
              maintainer:
                type: str
                required: true
              maintainer_bck:
                type: str
                required: false                 
              
          secrets:
            type: map
            mapping:
              AZURE_ARTIFACTS_USER:
                type: str
                required: false
              AZURE_ARTIFACTS_PW:
                type: str
                required: false             
              SONAR_TOKEN:
                type: str
                required: false
              SONAR_ROOT_CERT:
                type: str
                required: false
              APP_GHZOS_PW:
                type: str
                required: true                
              ACR_TOKEN_USER:
                type: str
                required: true
              ACR_TOKEN_PW:
                type: str
                required: true
              RAM_GITHUB_GIT_TOKEN:
                type: str
                required: false
              GH_TOKEN_ENCRYPTION_PASSPHRASE:
                type: str
                required: false
      deploy:
        type: map
        required: false
        mapping:
          needs:
            type: any
            required: false
          if:
            type: str
            required: false
          uses:
            type: str
            required: false
          with:
            type: map
            required: false
            mapping:
              component_shortname:
                type: str
                required: false
              component_name:
                type: str
                required: false
              component_version:
                type: str
                required: false
              component_archetype:
                type: str
                required: false
              environment:
                type: str
                required: false
              type:
                type: str
                required: false
              binding-repository:
                type: str
                required: false
              binding-repository-ref:
                type: str
                required: false
          secrets:
            type: map
            required: false
            mapping:
              TOKEN_GH:
                type: str
                required: false
              GH_TOKEN_ENCRYPTION_PASSPHRASE:
                type: str
                required: false
              AZURE_ARTIFACTS_PW:
                type: str
                required: false
              ACR_TOKEN_USER:
                type: str
                required: false
              ACR_TOKEN_PW:
                type: str
                required: false
              SP_CLIENT_ID:
                type: str
                required: false
              SP_CLIENT_SECRET:
                type: str
                required: false
              APP_CDZOS_PW:
                type: str
                required: false