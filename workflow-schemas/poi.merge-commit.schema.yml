type: map
mapping:
  name:
    type: str
    required: true
  run-name:
    type: str
    required: true
  on:
    type: map
    mapping:
      pull_request:
        type: map
        mapping:
          types:
            type: seq
            sequence:
              - type: str
          branches:
            type: seq
            sequence:
              - type: str
  jobs:
    type: map
    mapping:
      merge:
        type: map
        mapping:
          name:
            type: str
            required: false
          uses:
            type: str
          with:
            type: map
            mapping:
              java-version:
                type: str
                required: false
              java-extra-args:
                type: str
                required: false
              jdk-distribution:
                type: str
                required: false
              maven-version:
                type: str
                required: false
              cache-enabled:
                type: bool
                required: false
              next-snapshot-create-pull-request:
                type: bool
                required: false
              source-folder:
                type: str
                required: false
              is-fix:
                type: bool
                required: false
              create-snapshot-tag:
                type: bool
                required: false
          secrets:
            type: map
            mapping:
              AZURE_ARTIFACTS_USER:
                type: str
                required: true
              AZURE_ARTIFACTS_PW:
                type: str
                required: true
              RAM_GITHUB_GIT_TOKEN:
                type: str
                required: false
              GH_TOKEN_ENCRYPTION_PASSPHRASE:
                type: str
                required: false
